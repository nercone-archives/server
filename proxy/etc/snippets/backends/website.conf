include /etc/nginx/snippets/error.conf;

proxy_read_timeout 300s;
proxy_send_timeout 300s;

location ~* \.(ttf|otf|woff|woff2)$ {
    proxy_pass http://website_backend;
    proxy_buffering off;
    include /etc/nginx/snippets/proxy.conf;
}

location / {
    proxy_pass http://website_backend;
    include /etc/nginx/snippets/proxy.conf;
}
