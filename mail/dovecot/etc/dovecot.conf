dovecot_config_version  = 2.4.1
dovecot_storage_version = 2.4.0

base_dir = /run/dovecot

log_path      = /dev/stderr
info_log_path = /dev/stderr

protocols = imap lmtp sieve

ssl = no
auth_allow_cleartext = yes

auth_mechanisms = plain login

mail_driver = maildir
mail_path   = ~/Maildir
mail_home   = /srv/vmail/%{user | domain}/%{user | username}
mail_uid    = vmail
mail_gid    = vmail

mailbox_list_layout = maildir++

haproxy_trusted_networks = 172.30.0.0/24

sql_driver = pgsql

pgsql postgres {
  dbname   = mail
  user     = mail
  password = ${MAIL_DB_PASSWORD}
}

passdb sql {
  query = SELECT username || '@' || domain AS "user", password FROM accounts WHERE username = '%{user | username | lower}' AND domain = '%{user | domain | lower}' AND active
  default_password_scheme = ARGON2ID
}

userdb sql {
  query = SELECT username || '@' || domain AS "user" FROM accounts WHERE username = '%{user | username | lower}' AND domain = '%{user | domain | lower}' AND active
  iterate_query = SELECT username || '@' || domain AS "user" FROM accounts WHERE active
}

service imap-login {
  inet_listener imap {
    port    = 143
    haproxy = yes
  }
  inet_listener imap-internal {
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  inet_listener auth {
    port = 12345
  }
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

sieve_script personal {
  type        = personal
  driver      = file
  path        = ~/sieve
  active_path = ~/.dovecot.sieve
}

sieve_script default {
  type   = default
  name   = roundcube
  driver = file
  path   = /etc/dovecot/sieve/default.sieve
}

sieve_plugins {
  sieve_imapsieve   = yes
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

sieve_pipe_bin_dir = /etc/dovecot/sieve

imapsieve_mailbox to-junk {
  name   = Junk
  causes = COPY APPEND
  before = file:/etc/dovecot/sieve/learn-spam.sieve
}

imapsieve_mailbox from-junk {
  name   = *
  from   = Junk
  causes = COPY
  before = file:/etc/dovecot/sieve/learn-ham.sieve
}
