services:
  proxy:
    container_name: proxy
    build:
      context: ./proxy
    restart: unless-stopped
    network_mode: host
    labels:
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - ./proxy/etc:/etc/nginx:ro
      - ./proxy/log:/var/log/nginx:rw
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /run/website:/run/website
      - ./mail/roundcube/html:/var/www/roundcube:ro

  onion:
    container_name: onion
    build:
      context: ./onion
    restart: unless-stopped
    network_mode: host
    labels:
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - ./onion/etc:/etc/tor.d:ro
      - ./onion/data:/var/lib/tor

  gitea:
    container_name: gitea
    image: gitea/gitea:1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:3000"
      - "22:22"
    volumes:
      - ./gitea:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__database__SSL_MODE=require
      - GITEA__server__DOMAIN=git.nercone.dev
      - GITEA__server__ROOT_URL=https://git.nercone.dev/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  pds:
    container_name: pds
    image: ghcr.io/bluesky-social/pds:0.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      - ./pds:/pds
    environment:
      - PDS_HOSTNAME=pds.nercone.dev
      - PDS_JWT_SECRET=${PDS_JWT_SECRET}
      - PDS_ADMIN_PASSWORD=${PDS_ADMIN_PASSWORD}
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX}
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_BLOB_UPLOAD_LIMIT=314572800
      - PDS_DID_PLC_URL=https://plc.directory
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_REPORT_SERVICE_URL=https://mod.bsky.app
      - PDS_REPORT_SERVICE_DID=did:plc:ar7c4by46qjdydhdevvrndac
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true
      - PDS_RATE_LIMITS_ENABLED=true
      - PDS_INVITE_REQUIRED=true
      - PDS_EMAIL_SMTP_URL=smtps://pds%40nercone.dev:${PDS_EMAIL_SMTP_PASSWORD}@mx.nercone.dev:465/
      - PDS_EMAIL_FROM_ADDRESS=pds@nercone.dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/xrpc/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/cert.pem
      - -c
      - ssl_key_file=/etc/postgres-tls/key.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_ciphers=ECDHE-ECDSA-AES256-GCM-SHA384
      - -c
      - ssl_tls13_ciphers=TLS_AES_256_GCM_SHA384
      - -c
      - ssl_groups=X25519MLKEM768:secp384r1:secp256r1
      - -c
      - hba_file=/etc/postgres-tls/pg_hba.conf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgres-tls/pg_hba.conf:ro
      - ./tls/postgres:/etc/postgres-tls:ro
    networks:
      - default
      - mail
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GITEA_DB_PASSWORD=${GITEA_DB_PASSWORD}
      - MAIL_DB_PASSWORD=${MAIL_DB_PASSWORD}
      - ROUNDCUBE_DB_PASSWORD=${ROUNDCUBE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mail-postfix:
    container_name: mail-postfix
    build:
      context: ./mail/postfix
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "25:25"
      - "127.0.0.1:10025:10025"
    networks:
      mail:
        aliases:
          - postfix
    volumes:
      - ./mail/postfix/etc:/etc/postfix.d:ro
      - ./mail/data/spool:/var/spool/postfix
      - ./tls/postfix:/etc/postfix-tls:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - MAIL_DB_PASSWORD=${MAIL_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  mail-dovecot:
    container_name: mail-dovecot
    build:
      context: ./mail/dovecot
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "127.0.0.1:10143:143"
    networks:
      mail:
        aliases:
          - dovecot
    volumes:
      - ./mail/dovecot/etc:/etc/dovecot.d:ro
      - ./mail/dovecot/sieve:/etc/dovecot-sieve:ro
      - ./tls/dovecot:/etc/dovecot-tls:ro
      - ./mail/data/vmail:/srv/vmail
    environment:
      - MAIL_DB_PASSWORD=${MAIL_DB_PASSWORD}
      - RSPAMD_PASSWORD=${RSPAMD_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  mail-auth:
    container_name: mail-auth
    build:
      context: ./mail/auth
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "127.0.0.1:10080:10080"
    networks:
      mail:
        aliases:
          - auth
    volumes:
      - ./tls/auth:/srv/tls:ro
    depends_on:
      - mail-dovecot

  mail-roundcube:
    container_name: mail-roundcube
    build:
      context: ./mail/roundcube
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "127.0.0.1:8083:9000"
    networks:
      mail:
        aliases:
          - roundcube
    volumes:
      - ./mail/roundcube/etc:/etc/roundcube:ro
      - ./mail/roundcube/html:/var/www/roundcube
      - ./tls/roundcube:/etc/roundcube-tls:ro
      - ./mail/data/roundcube:/var/lib/roundcube
    environment:
      - ROUNDCUBE_DB_PASSWORD=${ROUNDCUBE_DB_PASSWORD}
      - ROUNDCUBE_DES_KEY=${ROUNDCUBE_DES_KEY}
      - MAIL_DB_PASSWORD=${MAIL_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  mail-rspamd:
    container_name: mail-rspamd
    build:
      context: ./mail/rspamd
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "127.0.0.1:11334:11334"
    networks:
      mail:
        aliases:
          - rspamd
    volumes:
      - ./mail/rspamd/etc:/etc/rspamd.d:ro
      - ./mail/data/rspamd:/var/lib/rspamd
    environment:
      - RSPAMD_PASSWORD=${RSPAMD_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mail-redis

  mail-redis:
    container_name: mail-redis
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "300", "10", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      mail:
        aliases:
          - redis
    volumes:
      - ./mail/data/redis:/data

  watchtower:
    container_name: watchtower
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    environment:
      TZ: "Asia/Tokyo"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 9 * * *"

networks:
  mail:
    name: mail
    ipam:
      config:
        - subnet: 172.30.0.0/24
